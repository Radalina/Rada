<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formular CV</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Introduceți informațiile pentru CV</h2>
    <button class="logout-btn"> <a href="../Auth/auth.html">Deconectare</a></button>>

    <form>
      <label>Nume complet:</label>
      <input type="text" placeholder="Nume Prenume">

      <label>Email:</label>
      <input type="email" placeholder="exemplu@email.com">

      <label>Telefon:</label>
      <input type="tel" placeholder="+40 123 456 789">

      <label>Locație:</label>
      <input type="text" placeholder="București, România">

      <label>Website:</label>
      <input type="url" placeholder="www.exemplu.com">

      <label>LinkedIn:</label>
      <input type="url" placeholder="linkedin.com/in/numeprenume">

      <label>GitHub:</label>
      <input type="url" placeholder="github.com/numeprenume">

      <div class="row">
        <label>Nivel experiență:</label>
        <select>
          <option>Începător</option>
          <option>Intermediar</option>
          <option>Avansat</option>
        </select>

        <label>Abilități principale:</label>
      </div>

      <textarea placeholder="Scrie abilitățile tale principale"></textarea>
    </form>
  </div>
</body>
</html>
